name: health_app
description: "Super Health App - AI Nutrition, Barcode Scanner & Wellness"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Networking
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1

  # Typography, Theming & UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0

  # Animations (วางไฟล์ Lottie .json ใน assets/animations/ ได้เลย)
  lottie: ^3.1.2

  # Hardware & Scanner
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  mobile_scanner: ^5.2.3
  google_mlkit_commons: ^0.13.0
  google_mlkit_image_labeling: ^0.16.1

  # Utilities & Storage
  intl: ^0.20.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/emojis/
